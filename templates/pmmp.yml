# Copy into the plugin repository. Hub replaces {{package_name}} on installation.
name: BedrockNexus Publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out plugin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP for PocketMine-MP 5
        uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0 # 3.2.0
        with:
          php-version: '8.2'
          install-path: ../bin

      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Download checksum-pinned Pharynx
        env:
          PHARYNX_URL: https://github.com/BedrockNexus/pharynx/releases/download/0.4.1-bedrocknexus.1/pharynx.phar
          PHARYNX_SHA256: db60e4e308ff4f60c212c08aab17019bc15967634b19103097b6381543748605
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pharynx.phar" "$PHARYNX_URL"
          echo "$PHARYNX_SHA256  $RUNNER_TEMP/pharynx.phar" | sha256sum -c -

      - name: Build plugin PHAR
        env:
          OUTPUT_PHAR: 'dist/{{package_name}}.phar'
        run: |
          mkdir -p dist
          php -d phar.readonly=0 "$RUNNER_TEMP/pharynx.phar" -i . -p="$OUTPUT_PHAR"

      - name: Upload plugin for build selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: 'dist/{{package_name}}.phar'
          if-no-files-found: error
