      - name: Build plugin with Pharynx
        run: |
          mkdir -p dist

          BUILD_ARGS=(
            -s "src"
            -f "plugin.toml"
          )

          if [[ -d resources ]]; then
            BUILD_ARGS+=(-f "resources")
          fi

          if [[ -f composer.json ]]; then
            BUILD_ARGS+=(-c=.)
          fi

          php "$RUNNER_TEMP/pharynx.phar" "${BUILD_ARGS[@]}"

          test -s output.phar
          mv output.phar "dist/{{package_name}}.phar"
