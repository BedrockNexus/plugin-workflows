# Copy into the plugin repository. Hub replaces {{package_name}} on installation.
name: BedrockNexus Publish

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out plugin source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up PHP for Axolotl-PM 5
        uses: axolotl-pm/setup-php-action@b8c3f9add4f2ad4a5e2624a1112aba899ee8db0e # 1.0.0
        with:
          php-version: '8.4'
          install-path: ../bin
          pm-version-major: '5'

      - name: Check PHP syntax
        run: find src -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Resolve DevTools dependency mode
        id: resolve_dependencies
        shell: bash
        run: |
          set -euo pipefail

          local_virion_file=''
          if [ -d virions ]; then
            local_virion_file="$(find virions -type f ! -name '.gitkeep' -print -quit)"
          fi

          if [ -n "$local_virion_file" ]; then
            echo 'virions=virions' >> "$GITHUB_OUTPUT"
            echo 'prepare=false' >> "$GITHUB_OUTPUT"
            echo 'Using local virions/ sources.'
            exit 0
          fi

          has_composer_json=false
          has_composer_lock=false
          if [ -f composer.json ]; then has_composer_json=true; fi
          if [ -f composer.lock ]; then has_composer_lock=true; fi

          if [ "$has_composer_json" != "$has_composer_lock" ]; then
            echo 'Composer dependency preparation requires both composer.json and composer.lock.' >&2
            echo 'Commit a lockfile or provide virion sources in virions/.' >&2
            exit 1
          fi

          if [ "$has_composer_json" = true ]; then
            echo 'virions=.devtools-virions' >> "$GITHUB_OUTPUT"
            echo 'prepare=true' >> "$GITHUB_OUTPUT"
            echo 'Preparing locked Composer virions.'
          else
            echo 'virions=virions' >> "$GITHUB_OUTPUT"
            echo 'prepare=false' >> "$GITHUB_OUTPUT"
            echo 'No local or Composer virion dependencies detected.'
          fi

      - name: Build with DevTools
        id: build
        uses: NhanAZ/DevTools@8b7db655845dc5d9e5e51b26a5d0815d5f7e5323 # v2.1.1
        with:
          project: .
          virions: ${{ steps.resolve_dependencies.outputs.virions }}
          output: build
          prepare-dependencies: ${{ steps.resolve_dependencies.outputs.prepare }}

      - name: Stage the plugin file
        env:
          SOURCE_PHAR: ${{ steps.build.outputs.phar }}
          OUTPUT_PHAR: 'dist/{{package_name}}.phar'
        run: |
          mkdir -p dist
          cp -- "$SOURCE_PHAR" "$OUTPUT_PHAR"

      - name: Upload plugin for build selection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-package
          path: 'dist/{{package_name}}.phar'
          if-no-files-found: error
